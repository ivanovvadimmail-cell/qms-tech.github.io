<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, nofollow, noarchive, nosnippet, noimageindex">

    <title>qMS</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        #loader {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .box {
            width: 420px;
            max-width: 100%;
            background: #1f2937;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #111827;
            color: white;
            font-size: 17px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            color: #94a3b8;
        }

        .error {
            color: #f87171 !important;
        }

        #content {
            width: 100%;
            min-height: 100vh;
        }

        #content iframe {
            border: 0;
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>

<body>

<div id="loader">

    <div class="box">

        <h1>qMS</h1>

        <div>
            Для доступа к презентации введите ключ.
        </div>

        <input
            id="password"
            type="password"
            placeholder="Ключ доступа"
            autocomplete="off"
        >

        <button id="login">
            Войти
        </button>

        <div id="message"></div>

    </div>

</div>

<div id="content"></div>


<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>

const ITERATIONS = 310000;

let files = {};
let blobUrls = {};
let unlocked = false;


/* =========================================================
   Получение AES-256 ключа
   ========================================================= */

async function deriveKey(password, salt) {

    const encoder = new TextEncoder();

    const baseKey =
        await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    return await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: ITERATIONS,
            hash: "SHA-256"
        },
        baseKey,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["decrypt"]
    );
}


/* =========================================================
   MIME-типы
   ========================================================= */

function mimeType(path) {

    const p = path.toLowerCase();

    if (p.endsWith(".html") || p.endsWith(".htm"))
        return "text/html;charset=utf-8";

    if (p.endsWith(".css"))
        return "text/css;charset=utf-8";

    if (p.endsWith(".js"))
        return "text/javascript;charset=utf-8";

    if (p.endsWith(".json"))
        return "application/json";

    if (p.endsWith(".png"))
        return "image/png";

    if (p.endsWith(".jpg") || p.endsWith(".jpeg"))
        return "image/jpeg";

    if (p.endsWith(".webp"))
        return "image/webp";

    if (p.endsWith(".gif"))
        return "image/gif";

    if (p.endsWith(".svg"))
        return "image/svg+xml";

    if (p.endsWith(".ico"))
        return "image/x-icon";

    if (p.endsWith(".woff"))
        return "font/woff";

    if (p.endsWith(".woff2"))
        return "font/woff2";

    if (p.endsWith(".ttf"))
        return "font/ttf";

    if (p.endsWith(".mp4"))
        return "video/mp4";

    if (p.endsWith(".webm"))
        return "video/webm";

    if (p.endsWith(".mp3"))
        return "audio/mpeg";

    return "application/octet-stream";
}


/* =========================================================
   Нормализация пути
   ========================================================= */

function normalizePath(path) {

    path = path.replace(/\\/g, "/");

    while (path.startsWith("./")) {
        path = path.substring(2);
    }

    const parts = [];

    for (const part of path.split("/")) {

        if (!part || part === ".")
            continue;

        if (part === "..") {
            parts.pop();
        } else {
            parts.push(part);
        }
    }

    return parts.join("/");
}


/* =========================================================
   Определение абсолютного пути ресурса
   относительно HTML/CSS файла
   ========================================================= */

function resolvePath(baseFile, resource) {

    if (!resource)
        return null;

    resource = resource.trim();

    if (
        resource.startsWith("#") ||
        resource.startsWith("data:") ||
        resource.startsWith("blob:") ||
        resource.startsWith("javascript:") ||
        resource.startsWith("mailto:")
    ) {
        return null;
    }

    if (resource.startsWith("/")) {
        return normalizePath(resource);
    }

    const baseParts = baseFile.split("/");

    baseParts.pop();

    return normalizePath(
        baseParts.concat(resource.split("/")).join("/")
    );
}


/* =========================================================
   Создание Blob URL для всех файлов
   ========================================================= */

function createBlobUrls() {

    for (const path in files) {

        const blob =
            new Blob(
                [files[path]],
                {
                    type: mimeType(path)
                }
            );

        blobUrls[path] =
            URL.createObjectURL(blob);
    }
}


/* =========================================================
   Обработка CSS
   ========================================================= */

function processCss(css, cssPath) {

    return css.replace(
        /url\s*\(\s*(['"]?)(.*?)\1\s*\)/gi,
        function(match, quote, resource) {

            resource = resource.trim();

            const resolved =
                resolvePath(
                    cssPath,
                    resource
                );

            if (
                resolved &&
                blobUrls[resolved]
            ) {

                return "url('" +
                    blobUrls[resolved] +
                    "')";
            }

            return match;
        }
    );
}


/* =========================================================
   Создание Blob URL для CSS после обработки
   ========================================================= */

function processAllCss() {

    for (const path in files) {

        if (!path.toLowerCase().endsWith(".css"))
            continue;

        const decoder =
            new TextDecoder("utf-8");

        const css =
            decoder.decode(files[path]);

        const processed =
            processCss(
                css,
                path
            );

        const blob =
            new Blob(
                [processed],
                {
                    type: "text/css"
                }
            );

        URL.revokeObjectURL(blobUrls[path]);

        blobUrls[path] =
            URL.createObjectURL(blob);
    }
}


/* =========================================================
   Загрузка HTML страницы
   ========================================================= */

function getCurrentPage() {

    let path =
        window.location.pathname;

    path =
        decodeURIComponent(path);

    path =
        path.replace(/^\/+/, "");

    path =
        path.replace(/\/+$/, "");

    if (!path)
        return "index.html";

    if (path.toLowerCase().endsWith(".html"))
        return path;

    return path + "/index.html";
}


/* =========================================================
   Обработка HTML
   ========================================================= */

function processHtml(html, htmlPath) {

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /* ---------------------------------------------
       CSS
       --------------------------------------------- */

    doc.querySelectorAll(
        'link[href]'
    ).forEach(link => {

        const href =
            link.getAttribute("href");

        const resolved =
            resolvePath(
                htmlPath,
                href
            );

        if (
            resolved &&
            blobUrls[resolved]
        ) {

            link.setAttribute(
                "href",
                blobUrls[resolved]
            );
        }

    });


    /* ---------------------------------------------
       Картинки
       --------------------------------------------- */

    doc.querySelectorAll(
        'img[src], source[src], video[src], audio[src]'
    ).forEach(element => {

        const src =
            element.getAttribute("src");

        const resolved =
            resolvePath(
                htmlPath,
                src
            );

        if (
            resolved &&
            blobUrls[resolved]
        ) {

            element.setAttribute(
                "src",
                blobUrls[resolved]
            );
        }

    });


    /* ---------------------------------------------
       poster у video
       --------------------------------------------- */

    doc.querySelectorAll(
        '[poster]'
    ).forEach(element => {

        const poster =
            element.getAttribute("poster");

        const resolved =
            resolvePath(
                htmlPath,
                poster
            );

        if (
            resolved &&
            blobUrls[resolved]
        ) {

            element.setAttribute(
                "poster",
                blobUrls[resolved]
            );
        }

    });


    /* ---------------------------------------------
       JS
       --------------------------------------------- */

    doc.querySelectorAll(
        'script[src]'
    ).forEach(script => {

        const src =
            script.getAttribute("src");

        const resolved =
            resolvePath(
                htmlPath,
                src
            );

        if (
            resolved &&
            blobUrls[resolved]
        ) {

            script.setAttribute(
                "src",
                blobUrls[resolved]
            );
        }

    });


    /* ---------------------------------------------
       Ссылки между страницами
       --------------------------------------------- */

    doc.querySelectorAll(
        'a[href]'
    ).forEach(link => {

        const href =
            link.getAttribute("href");

        if (
            !href ||
            href.startsWith("#") ||
            href.startsWith("http://") ||
            href.startsWith("https://") ||
            href.startsWith("mailto:")
        ) {
            return;
        }


        const resolved =
            resolvePath(
                htmlPath,
                href
            );


        if (!resolved)
            return;


        let target =
            resolved;


        /*
            Если ссылка ведёт на index.html,
            превращаем её в красивый URL каталога.
        */

        if (
            target.toLowerCase().endsWith("/index.html")
        ) {

            target =
                target.substring(
                    0,
                    target.length -
                    "/index.html".length
                );
        }

        if (
            target.toLowerCase() === "index.html"
        ) {

            target = "";
        }


        link.setAttribute(
            "href",
            "/" + target
        );


        link.addEventListener(
            "click",
            function(event) {

                if (
                    event.ctrlKey ||
                    event.shiftKey ||
                    event.metaKey ||
                    event.altKey
                ) {
                    return;
                }

                event.preventDefault();

                const newPath =
                    "/" + target;

                history.pushState(
                    {},
                    "",
                    newPath
                );

                renderCurrentPage();

            }
        );

    });


    return doc;
}


/* =========================================================
   Отображение текущей страницы
   ========================================================= */

async function renderCurrentPage() {

    const page =
        getCurrentPage();

    if (!files[page]) {

        /*
            Иногда путь может быть без index.html
        */

        const alternative =
            normalizePath(
                page.replace(
                    /\/index\.html$/i,
                    ""
                ) +
                "/index.html"
            );

        if (files[alternative]) {

            await renderPage(
                alternative
            );

            return;
        }


        document.getElementById(
            "content"
        ).innerHTML =

            "<div style='padding:40px;font-family:Arial'>" +
            "<h1>Страница не найдена</h1>" +
            "</div>";

        return;
    }

    await renderPage(page);
}


/* =========================================================
   Реальное отображение страницы
   ========================================================= */

async function renderPage(page) {

    const decoder =
        new TextDecoder("utf-8");

    const html =
        decoder.decode(
            files[page]
        );


    const doc =
        processHtml(
            html,
            page
        );


    document.getElementById(
        "loader"
    ).style.display = "none";


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    /*
        Переносим содержимое BODY
    */

    while (doc.body.firstChild) {

        content.appendChild(
            doc.body.firstChild
        );
    }


    /*
        Выполняем inline scripts
    */

    const scripts =
        content.querySelectorAll(
            "script"
        );

    for (const oldScript of scripts) {

        const newScript =
            document.createElement(
                "script"
            );

        for (
            const attr of oldScript.attributes
        ) {

            newScript.setAttribute(
                attr.name,
                attr.value
            );

        }

        newScript.textContent =
            oldScript.textContent;

        oldScript.replaceWith(
            newScript
        );
    }


    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   Расшифровка qms.dat
   ========================================================= */

async function decryptSite(password) {

    const response =
        await fetch(
            "/qms.dat",
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "Не найден qms.dat"
        );
    }


    const data =
        new Uint8Array(
            await response.arrayBuffer()
        );


    /*
        Проверяем сигнатуру
    */

    const magic =
        new TextDecoder().decode(
            data.slice(0, 4)
        );

    if (magic !== "QMS1") {

        throw new Error(
            "Неверный формат qms.dat"
        );
    }


    /*
        Извлекаем salt
    */

    const salt =
        data.slice(
            4,
            20
        );


    /*
        Извлекаем IV
    */

    const iv =
        data.slice(
            20,
            32
        );


    /*
        Зашифрованные данные
    */

    const encrypted =
        data.slice(
            32
        );


    /*
        Создаём ключ
    */

    const key =
        await deriveKey(
            password,
            salt
        );


    /*
        Расшифровываем
    */

    let decrypted;

    try {

        decrypted =
            new Uint8Array(
                await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    encrypted
                )
            );

    } catch (error) {

        throw new Error(
            "Неверный ключ доступа"
        );
    }


    /*
        Распаковываем ZIP
    */

    const zip =
        fflate.unzipSync(
            decrypted
        );


    files = zip;


    /*
        Создаём Blob URL
        для всех файлов
    */

    createBlobUrls();


    /*
        CSS нужно обработать отдельно
    */

    processAllCss();


    unlocked = true;


    /*
        Убираем key из адресной строки
    */

    const cleanUrl =
        window.location.pathname;

    history.replaceState(
        {},
        "",
        cleanUrl
    );


    await renderCurrentPage();
}


/* =========================================================
   Кнопка входа
   ========================================================= */

document
    .getElementById("login")
    .addEventListener(
        "click",
        async function() {

            const password =
                document.getElementById(
                    "password"
                ).value;

            const message =
                document.getElementById(
                    "message"
                );

            if (!password) {

                message.textContent =
                    "Введите ключ.";

                message.className =
                    "error";

                return;
            }


            message.textContent =
                "Расшифровка сайта...";

            message.className = "";


            try {

                await decryptSite(
                    password
                );

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message;

                message.className =
                    "error";

            }

        }
    );


/* =========================================================
   Enter в поле пароля
   ========================================================= */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                document
                    .getElementById("login")
                    .click();

            }

        }
    );


/* =========================================================
   Автоматический вход через ?key=1981
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const key =
    params.get("key");

if (key) {

    document.getElementById(
        "password"
    ).value = key;

    decryptSite(key)
        .catch(error => {

            console.error(error);

            document.getElementById(
                "message"
            ).textContent =
                error.message;

            document.getElementById(
                "message"
            ).className =
                "error";

        });
}


/* =========================================================
   Работа кнопок браузера Назад / Вперёд
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        if (unlocked) {

            renderCurrentPage();

        }

    }
);

</script>

</body>
</html>
