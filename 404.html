<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>

"use strict";


/* =======================================================
   ГЛОБАЛЬНЫЕ ДАННЫЕ
======================================================= */

let files = {};
let blobUrls = {};
let unlocked = false;


/* =======================================================
   PBKDF2 → AES-256-GCM
======================================================= */

async function deriveKey(password, salt) {

    const encoder = new TextEncoder();

    const passwordKey =
        await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

    return await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 310000,
            hash: "SHA-256"
        },
        passwordKey,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["decrypt"]
    );
}


/* =======================================================
   MIME
======================================================= */

function mimeType(path) {

    const ext =
        path
            .split("?")[0]
            .split("#")[0]
            .split(".")
            .pop()
            .toLowerCase();

    const map = {

        html: "text/html",
        htm: "text/html",

        css: "text/css",

        js: "application/javascript",
        mjs: "application/javascript",

        json: "application/json",

        png: "image/png",
        jpg: "image/jpeg",
        jpeg: "image/jpeg",
        gif: "image/gif",
        webp: "image/webp",
        svg: "image/svg+xml",
        ico: "image/x-icon",

        woff: "font/woff",
        woff2: "font/woff2",
        ttf: "font/ttf",
        otf: "font/otf",

        mp4: "video/mp4",
        webm: "video/webm",

        mp3: "audio/mpeg",
        wav: "audio/wav"
    };

    return map[ext] ||
           "application/octet-stream";
}


/* =======================================================
   НОРМАЛИЗАЦИЯ ПУТИ
======================================================= */

function normalizePath(path) {

    if (!path)
        return "";

    path =
        path.split("?")[0];

    path =
        path.split("#")[0];

    path =
        path.replace(/\\/g, "/");

    const parts = [];

    for (
        const part of path.split("/")
    ) {

        if (
            !part ||
            part === "."
        ) {
            continue;
        }

        if (
            part === ".."
        ) {

            if (parts.length)
                parts.pop();

            continue;
        }

        parts.push(part);
    }

    return parts.join("/");
}


/* =======================================================
   ОПРЕДЕЛИТЬ ЦЕЛЕВОЙ ФАЙЛ
======================================================= */

function resolveResource(
    resource,
    currentPage
) {

    if (!resource)
        return null;

    resource =
        resource.trim();

    if (
        resource.startsWith("data:") ||
        resource.startsWith("blob:") ||
        resource.startsWith("#") ||
        resource.startsWith("mailto:")
    ) {
        return null;
    }

    if (
        resource.startsWith("http://") ||
        resource.startsWith("https://") ||
        resource.startsWith("//")
    ) {
        return null;
    }

    /*
       Абсолютный виртуальный путь:

       /gov/images/a.png
       /com/style.css
    */

    if (
        resource.startsWith("/")
    ) {

        return normalizePath(
            resource
        );
    }

    /*
       Относительный путь:

       images/a.png
       ../images/a.png
    */

    const base =
        currentPage.includes("/")
            ? currentPage.substring(
                0,
                currentPage.lastIndexOf("/") + 1
              )
            : "";

    return normalizePath(
        base + resource
    );
}


/* =======================================================
   НАЙТИ ФАЙЛ В АРХИВЕ
======================================================= */

function findFile(path) {

    path =
        normalizePath(path);

    if (
        Object.prototype.hasOwnProperty.call(
            files,
            path
        )
    ) {
        return path;
    }

    /*
       Если это директория,
       пробуем index.html.
    */

    if (
        !path.endsWith(".html")
    ) {

        const indexPath =
            path
                ? path + "/index.html"
                : "index.html";

        if (
            Object.prototype.hasOwnProperty.call(
                files,
                indexPath
            )
        ) {
            return indexPath;
        }
    }

    return null;
}


/* =======================================================
   СОЗДАНИЕ BLOB URL
======================================================= */

function createBlobUrls() {

    blobUrls = {};

    for (
        const path in files
    ) {

        const data =
            files[path];

        const blob =
            new Blob(
                [data],
                {
                    type: mimeType(path)
                }
            );

        blobUrls[path] =
            URL.createObjectURL(blob);
    }
}


/* =======================================================
   ОБРАБОТКА CSS
======================================================= */

function processCss(
    css,
    cssPath
) {

    return css.replace(
        /url\(\s*(['"]?)(.*?)\1\s*\)/gi,
        function(
            match,
            quote,
            url
        ) {

            url =
                url.trim();

            if (
                !url ||
                url.startsWith("data:") ||
                url.startsWith("http://") ||
                url.startsWith("https://") ||
                url.startsWith("//") ||
                url.startsWith("#") ||
                url.startsWith("blob:")
            ) {

                return match;
            }

            const target =
                resolveResource(
                    url,
                    cssPath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                return (
                    "url('" +
                    blobUrls[target] +
                    "')"
                );
            }

            return match;
        }
    );
}


/* =======================================================
   ОБРАБОТКА ВСЕГО CSS
======================================================= */

function processAllCss() {

    for (
        const path in files
    ) {

        if (
            !path
                .toLowerCase()
                .endsWith(".css")
        ) {
            continue;
        }

        const original =
            new TextDecoder()
                .decode(
                    files[path]
                );

        const processed =
            processCss(
                original,
                path
            );

        files[path] =
            new TextEncoder()
                .encode(
                    processed
                );

        if (
            blobUrls[path]
        ) {

            URL.revokeObjectURL(
                blobUrls[path]
            );
        }

        const blob =
            new Blob(
                [files[path]],
                {
                    type: "text/css"
                }
            );

        blobUrls[path] =
            URL.createObjectURL(
                blob
            );
    }
}


/* =======================================================
   ТЕКУЩАЯ СТРАНИЦА
======================================================= */

function getCurrentPage() {

    /*
       Если есть виртуальный hash,
       используем его.
    */

    if (
        window.location.hash
    ) {

        let hash =
            window.location.hash
                .substring(1);

        if (
            hash.startsWith("/")
        ) {
            hash =
                hash.substring(1);
        }

        if (hash)
            return normalizePath(hash);
    }

    /*
       Обычный URL.

       Для / используем index.html.
    */

    let path =
        window.location.pathname;

    path =
        decodeURIComponent(path);

    path =
        path.replace(
            /^\/+/,
            ""
        );

    /*
       GitHub Pages project path
    */

    const parts =
        path.split("/");

    if (
        parts[0] ===
        "qms-tech.github.io"
    ) {

        parts.shift();
    }

    path =
        parts.join("/");

    if (
        !path ||
        path.endsWith("/")
    ) {

        path += "index.html";
    }

    if (
        !path.endsWith(".html")
    ) {

        path += "/index.html";
    }

    return normalizePath(path);
}


/* =======================================================
   ОБРАБОТКА HTML
======================================================= */

function processHtml(
    html,
    pagePath
) {

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /* ---------------------------------------------------
       CSS
    --------------------------------------------------- */

    doc.querySelectorAll(
        'link[href]'
    ).forEach(
        function(link) {

            const href =
                link.getAttribute(
                    "href"
                );

            if (!href)
                return;

            const target =
                resolveResource(
                    href,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                link.setAttribute(
                    "href",
                    blobUrls[target]
                );
            }
        }
    );


    /* ---------------------------------------------------
       IMG
    --------------------------------------------------- */

    doc.querySelectorAll(
        "img[src]"
    ).forEach(
        function(img) {

            const src =
                img.getAttribute(
                    "src"
                );

            const target =
                resolveResource(
                    src,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                img.setAttribute(
                    "src",
                    blobUrls[target]
                );
            }
        }
    );


    /* ---------------------------------------------------
       srcset
    --------------------------------------------------- */

    doc.querySelectorAll(
        "[srcset]"
    ).forEach(
        function(el) {

            const srcset =
                el.getAttribute(
                    "srcset"
                );

            if (!srcset)
                return;

            const result =
                srcset
                    .split(",")
                    .map(
                        function(item) {

                            const parts =
                                item.trim()
                                    .split(/\s+/);

                            const target =
                                resolveResource(
                                    parts[0],
                                    pagePath
                                );

                            if (
                                target &&
                                blobUrls[target]
                            ) {

                                parts[0] =
                                    blobUrls[target];
                            }

                            return parts.join(" ");
                        }
                    )
                    .join(", ");

            el.setAttribute(
                "srcset",
                result
            );
        }
    );


    /* ---------------------------------------------------
       VIDEO / AUDIO / SOURCE
    --------------------------------------------------- */

    doc.querySelectorAll(
        "video[src], audio[src], source[src]"
    ).forEach(
        function(el) {

            const src =
                el.getAttribute(
                    "src"
                );

            const target =
                resolveResource(
                    src,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                el.setAttribute(
                    "src",
                    blobUrls[target]
                );
            }
        }
    );


    /* ---------------------------------------------------
       POSTER
    --------------------------------------------------- */

    doc.querySelectorAll(
        "[poster]"
    ).forEach(
        function(el) {

            const poster =
                el.getAttribute(
                    "poster"
                );

            const target =
                resolveResource(
                    poster,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                el.setAttribute(
                    "poster",
                    blobUrls[target]
                );
            }
        }
    );


    /* ---------------------------------------------------
       ВНУТРЕННИЕ ССЫЛКИ
    --------------------------------------------------- */

    doc.querySelectorAll(
        "a[href]"
    ).forEach(
        function(a) {

            const href =
                a.getAttribute(
                    "href"
                );

            if (!href)
                return;

            if (
                href.startsWith("#")
            ) {
                return;
            }

            if (
                href.startsWith(
                    "javascript:"
                )
            ) {
                return;
            }

            if (
                href.startsWith(
                    "mailto:"
                )
            ) {
                return;
            }

            if (
                href.startsWith(
                    "tel:"
                )
            ) {
                return;
            }

            if (
                href.startsWith(
                    "http://"
                ) ||
                href.startsWith(
                    "https://"
                ) ||
                href.startsWith("//")
            ) {
                return;
            }


            let cleanHref =
                href.split("?")[0]
                    .split("#")[0];

            const target =
                resolveResource(
                    cleanHref,
                    pagePath
                );

            if (!target)
                return;


            let pageTarget =
                target;

            /*
               Ссылка на каталог:
               gov/
               com/
               и т.д.
            */

            if (
                pageTarget.endsWith("/")
            ) {

                pageTarget +=
                    "index.html";
            }

            /*
               Если такого файла нет,
               проверяем index.html
            */

            const resolved =
                findFile(
                    pageTarget
                );

            if (
                resolved
            ) {

                let hash =
                    "#/" +
                    resolved;

                /*
                   Сохраняем fragment
                */

                const fragment =
                    href.includes("#")
                        ? href.substring(
                            href.indexOf("#")
                          )
                        : "";

                if (fragment)
                    hash += fragment;

                a.setAttribute(
                    "href",
                    hash
                );
            }
        }
    );


    return doc;
}


/* =======================================================
   ПОДКЛЮЧЕНИЕ HEAD СТРАНИЦЫ
======================================================= */

function applyPageHead(
    doc,
    pagePath
) {

    /*
       Удаляем CSS предыдущей страницы.
    */

    document
        .querySelectorAll(
            "[data-qms-page-head]"
        )
        .forEach(
            function(el) {

                el.remove();
            }
        );


    /*
       TITLE
    */

    const title =
        doc.querySelector(
            "title"
        );

    if (title) {

        document.title =
            title.textContent;
    }


    /*
       STYLE
    */

    doc.querySelectorAll(
        "style"
    ).forEach(
        function(oldStyle) {

            const style =
                document.createElement(
                    "style"
                );

            style.setAttribute(
                "data-qms-page-head",
                "1"
            );

            style.textContent =
                oldStyle.textContent;

            document.head.appendChild(
                style
            );
        }
    );


    /*
       LINK STYLESHEET
    */

    doc.querySelectorAll(
        'link[rel="stylesheet"]'
    ).forEach(
        function(link) {

            const href =
                link.getAttribute(
                    "href"
                );

            if (!href)
                return;

            const target =
                resolveResource(
                    href,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                const newLink =
                    document.createElement(
                        "link"
                    );

                newLink.rel =
                    "stylesheet";

                newLink.href =
                    blobUrls[target];

                newLink.setAttribute(
                    "data-qms-page-head",
                    "1"
                );

                document.head.appendChild(
                    newLink
                );
            }
        }
    );


    /*
       favicon
    */

    doc.querySelectorAll(
        'link[rel="icon"], link[rel="shortcut icon"]'
    ).forEach(
        function(link) {

            const href =
                link.getAttribute(
                    "href"
                );

            const target =
                resolveResource(
                    href,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                const newLink =
                    document.createElement(
                        "link"
                    );

                newLink.rel =
                    link.rel;

                newLink.href =
                    blobUrls[target];

                newLink.setAttribute(
                    "data-qms-page-head",
                    "1"
                );

                document.head.appendChild(
                    newLink
                );
            }
        }
    );
}


/* =======================================================
   ВЫПОЛНЕНИЕ JAVASCRIPT
======================================================= */

async function executeScripts(
    doc,
    pagePath,
    container
) {

    const scripts =
        Array.from(
            doc.querySelectorAll(
                "script"
            )
        );

    for (
        const script of scripts
    ) {

        const newScript =
            document.createElement(
                "script"
            );


        /*
           Внешний JS
        */

        const src =
            script.getAttribute(
                "src"
            );

        if (src) {

            const target =
                resolveResource(
                    src,
                    pagePath
                );

            if (
                target &&
                blobUrls[target]
            ) {

                newScript.src =
                    blobUrls[target];

            } else {

                /*
                   Внешний интернет-JS
                   оставляем как есть.
                */

                newScript.src =
                    src;
            }

        } else {

            /*
               Inline JS
            */

            newScript.textContent =
                script.textContent;
        }


        /*
           Копируем type
        */

        if (
            script.type
        ) {

            newScript.type =
                script.type;
        }


        container.appendChild(
            newScript
        );
    }
}


/* =======================================================
   ОТРИСОВКА СТРАНИЦЫ
======================================================= */

async function renderPage(
    pagePath
) {

    const actual =
        findFile(
            pagePath
        );

    if (!actual) {

        throw new Error(
            "Страница не найдена в qms.dat: " +
            pagePath
        );
    }


    console.log(
        "Открываем страницу:",
        actual
    );


    const html =
        new TextDecoder()
            .decode(
                files[actual]
            );


    const doc =
        processHtml(
            html,
            actual
        );


    /*
       HEAD
    */

    applyPageHead(
        doc,
        actual
    );


    /*
       BODY
    */

    const content =
        document.getElementById(
            "content"
        );

    content.innerHTML =
        "";


    Array.from(
        doc.body.childNodes
    ).forEach(
        function(node) {

            content.appendChild(
                document.importNode(
                    node,
                    true
                )
            );
        }
    );


    /*
       Скрипты запускаем после
       построения BODY.
    */

    await executeScripts(
        doc,
        actual,
        content
    );
}


/* =======================================================
   ТЕКУЩАЯ СТРАНИЦА
======================================================= */

async function renderCurrentPage() {

    const page =
        getCurrentPage();

    console.log(
        "Текущая виртуальная страница:",
        page
    );

    await renderPage(
        page
    );
}


/* =======================================================
   РАСШИФРОВКА QMS.DAT
======================================================= */

async function decryptSite(
    password
) {

    const qmsUrl =
        new URL(
            "qms.dat",
            document.baseURI
        ).href;


    console.log(
        "Загрузка qms.dat:",
        qmsUrl
    );


    const response =
        await fetch(
            qmsUrl,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Не удалось загрузить qms.dat. HTTP " +
            response.status +
            "\n" +
            qmsUrl
        );
    }


    const data =
        new Uint8Array(
            await response.arrayBuffer()
        );


    /*
       Проверяем QMS1
    */

    const magic =
        new TextDecoder()
            .decode(
                data.slice(0, 4)
            );


    if (
        magic !== "QMS1"
    ) {

        throw new Error(
            "qms.dat имеет неправильный формат."
        );
    }


    /*
       Формат:

       0-3   QMS1
       4-19  salt
       20-31 IV
       32+   encrypted
    */

    const salt =
        data.slice(
            4,
            20
        );

    const iv =
        data.slice(
            20,
            32
        );

    const encrypted =
        data.slice(
            32
        );


    /*
       Получаем AES-256 ключ
    */

    const key =
        await deriveKey(
            password,
            salt
        );


    let decrypted;


    try {

        decrypted =
            new Uint8Array(
                await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    encrypted
                )
            );

    } catch (error) {

        throw new Error(
            "Неверный ключ доступа."
        );
    }


    /*
       Распаковываем ZIP
    */

    try {

        files =
            fflate.unzipSync(
                decrypted
            );

    } catch (error) {

        throw new Error(
            "Не удалось распаковать qms.dat."
        );
    }


    console.log(
        "Файлов в архиве:",
        Object.keys(files).length
    );


    /*
       Создаём Blob URL
    */

    createBlobUrls();


    /*
       Обрабатываем CSS.
       Важно: после этого
       blobUrls CSS обновятся.
    */

    processAllCss();


    unlocked = true;


    /*
       Показываем сайт
    */

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "content"
    ).style.display =
        "block";


    /*
       Убираем ?key=...
       из адресной строки.
    */

    if (
        window.location.search
    ) {

        history.replaceState(
            {},
            "",
            window.location.pathname +
            window.location.hash
        );
    }


    /*
       Открываем текущую
       виртуальную страницу.
    */

    await renderCurrentPage();
}


/* =======================================================
   ВХОД
======================================================= */

async function login() {

    const input =
        document.getElementById(
            "password"
        );

    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "none";

    error.textContent =
        "";


    try {

        await decryptSite(
            input.value
        );

    } catch (e) {

        console.error(e);

        error.textContent =
            e.message ||
            "Ошибка загрузки.";

        error.style.display =
            "block";
    }
}


/* =======================================================
   КНОПКА ВХОДА
======================================================= */

document.getElementById(
    "loginButton"
).addEventListener(
    "click",
    login
);


/* =======================================================
   ENTER
======================================================= */

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "Enter"
        ) {

            login();
        }
    }
);


/* =======================================================
   HASH НАВИГАЦИЯ
======================================================= */

window.addEventListener(
    "hashchange",
    async function() {

        if (!unlocked)
            return;

        try {

            await renderCurrentPage();

            window.scrollTo(
                0,
                0
            );

        } catch (e) {

            console.error(e);
        }
    }
);


/* =======================================================
   АВТОМАТИЧЕСКИЙ ?key=1981
======================================================= */

(async function() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const key =
        params.get(
            "key"
        );

    if (key) {

        document.getElementById(
            "password"
        ).value =
            key;

        await login();
    }

})();

</script>
